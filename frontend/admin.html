<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin — Office Studio</title>
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/themes.css" />
<style>
  body { padding: 20px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  nav { display: flex; gap: 8px; margin: 16px 0 24px; }
  nav button { padding: 6px 14px; border-radius: 4px; background: var(--surface-3); }
  nav button.active { background: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; }
  th { background: var(--surface-2); font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-admin { background: #d4edda; color: #155724; }
  .badge-user { background: #eef; color: #2b579a; }
  .badge-off  { background: #f8d7da; color: #721c24; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat-card { padding: 16px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); }
  .stat-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
  .stat-card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>
  <header>
    <h1>Admin Console</h1>
    <p style="color:var(--text-muted);">Office Studio — self-hosted administrator</p>
  </header>

  <nav>
    <button data-view="stats" class="active">Overview</button>
    <button data-view="users">Users</button>
    <button data-view="audit">Audit log</button>
    <button data-view="settings">Settings</button>
  </nav>

  <main id="content"></main>

<script type="module">
import { api } from '/js/core/api.js';

const content = document.getElementById('content');
let current = 'stats';

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    current = b.dataset.view;
    render();
  };
});

async function render() {
  content.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Loading…</div>';
  try {
    if (current === 'stats')    await renderStats();
    if (current === 'users')    await renderUsers();
    if (current === 'audit')    await renderAudit();
    if (current === 'settings') renderSettings();
  } catch (e) {
    content.innerHTML = `<div style="padding:20px;color:#721c24;">Error: ${e.message}</div>`;
  }
}

async function renderStats() {
  const res = await api._fetch('/api/admin/stats');
  const j = await res.json();
  const kinds = j.documents_by_kind || {};
  content.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Users</div><div class="value">${j.users}</div></div>
      <div class="stat-card"><div class="label">Documents</div><div class="value">${j.documents}</div></div>
      <div class="stat-card"><div class="label">AI calls (30d)</div><div class="value">${j.ai_calls_30d}</div></div>
      <div class="stat-card"><div class="label">Storage used (MB)</div><div class="value">${j.storage_mb_used}</div></div>
      ${Object.entries(kinds).map(([k, v]) => `
        <div class="stat-card"><div class="label">${k}</div><div class="value">${v}</div></div>
      `).join('')}
    </div>`;
}

async function renderUsers() {
  const res = await api._fetch('/api/admin/users');
  const users = await res.json();
  content.innerHTML = `
    <table>
      <thead>
        <tr><th>Email</th><th>Name</th><th>Role</th><th>Quota (MB)</th><th>Used (MB)</th><th>Active</th><th>Actions</th></tr>
      </thead>
      <tbody>
        ${users.map(u => `
          <tr data-id="${u.id}">
            <td>${u.email}</td>
            <td>${u.name || '—'}</td>
            <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
            <td><input type="number" value="${u.quota_mb}" class="q-input" style="width:80px;"></td>
            <td>${u.used_mb}</td>
            <td><input type="checkbox" ${u.is_active ? 'checked' : ''} class="a-input"></td>
            <td><button class="save-btn">Save</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;

  content.querySelectorAll('.save-btn').forEach(btn => {
    btn.onclick = async () => {
      const tr = btn.closest('tr');
      const id = tr.dataset.id;
      const quota = Number(tr.querySelector('.q-input').value);
      const active = tr.querySelector('.a-input').checked;
      const res = await api._fetch(`/api/admin/users/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ quota_mb: quota, is_active: active }),
      });
      if (res.ok) btn.textContent = '✓';
      setTimeout(() => btn.textContent = 'Save', 1500);
    };
  });
}

async function renderAudit() {
  const res = await api._fetch('/api/admin/audit?limit=200');
  const events = await res.json();
  content.innerHTML = `
    <table>
      <thead><tr><th>When</th><th>User</th><th>Action</th><th>Target</th><th>IP</th></tr></thead>
      <tbody>
        ${events.map(e => `
          <tr>
            <td>${new Date(e.at).toLocaleString()}</td>
            <td>${e.userId ?? '—'}</td>
            <td>${e.action}</td>
            <td>${e.target || '—'}</td>
            <td>${e.ip || '—'}</td>
          </tr>
        `).join('') || '<tr><td colspan="5" style="color:var(--text-muted);">No audit events yet.</td></tr>'}
      </tbody>
    </table>`;
}

function renderSettings() {
  content.innerHTML = `
    <h2 style="font-size:16px;">Retention & purge</h2>
    <p style="color:var(--text-muted);">Delete documents that have been in the trash for more than N days.</p>
    <label>Days: <input type="number" id="purgeDays" value="30" style="padding:4px;width:80px;"></label>
    <button class="primary-btn" id="purgeBtn" style="margin-left:8px;">Purge trash</button>
    <div id="purgeOut" style="margin-top:10px;color:var(--text-muted);"></div>`;

  document.getElementById('purgeBtn').onclick = async () => {
    const days = Number(document.getElementById('purgeDays').value);
    const res = await api._fetch(`/api/admin/purge-trash?days=${days}`, { method: 'DELETE' });
    const j = await res.json();
    document.getElementById('purgeOut').textContent = `Purged ${j.purged} documents.`;
  };
}

render();
</script>
</body>
</html>
